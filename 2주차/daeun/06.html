<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>a+img practice</title>
</head>
<body>
    <p>(1) 내부 리소스 이미지 첨부</p>
    <img src="../../../assignment/이다은 증명사진.jpg" alt="이다은 증명사진"  width="50">
    <!-- ../은 현재 작성 중인 파일을 기준으로 한 번 빠져나간다는 뜻임. 
    현재 코드 작성 중인 파일을 시작점으로 했을 때
    git-pratice 폴더를 선택하는 순간에 도달하기 위해서는 세 번 빠져나가야 하니 해당 코드를 세 번 사용하는 것이 맞음.-->

    <br><br><br>
    <!--연습 1,2 구분하기 위해서 줄바꿈-->

    <p>(2) 외부 리소스 이미지 첨부</p>
    <a href="https://www.google.com" target="_blank">Google
        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="구글이어라~" width="1000">
    </a>
    </p>
    <!-- img 빈 태그를 사용해서 원하는 사진의 링크를 첨부할 수 있음. 
    src 속성을 활용해 원하는 사진의 경로 또는 링크 주소를 입력할 수 있음.
    alt 속성을 활용해 첨부하고자 하는 사진의 설명 및 텍스트를 입력할 수 있음.
    width 속성을 활용해 사진의 크기를 조절할 수 있음. 
    a 태그 안에 img 태그를 넣으면 해당 사진에 링크를 걸 수 있음. 
    -->
</body>
</html>
