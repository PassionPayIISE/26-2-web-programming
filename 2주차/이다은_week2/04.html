<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>h(n) practice</title>
</head>
<body>
    <p>웹개발 &nbsp; &nbsp;화이팅~<br>데이터분석도 화이팅~</p>
    <!-- &ndsp;는 간격을 내기 위한 태그. 이런걸 entity라고 함 -->
    <!-- p 태그를 사용하면 하나의 문단 안에서 작성됨.
    해당 문단 안에서 줄바꿈을 하려면 <br> 태그를 사용할 수 있음. 
    p 태그를 활용하여 단락을 바꿈으로써 줄바꿈을 하는 것은 바람직하지 않음. -->
    
    <p>lorem ipsum dolor sit amet  </p>
    <!-- p태그를 사용하고 안에 'lorem'이라고 치면 자동으로 문장을 생성함-->

</body> 
</html>
