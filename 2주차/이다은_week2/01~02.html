<!-- 콘텐츠가 있는 태그 -> <div>, <p>, <span> -> 오픈태그<div> , 클로즈태그</div> 로 구성됨.-->
<!-- 콘텐츠가 없는 태그(빈 태그) -> <br>, <img>, <meta> -> 오픈태그만 존재.-->

<!DOCTYPE html> <!-- 문서의 html 버전을 결정하는 태그. -->
<html lang="en"> <!-- 문서의 언어를 결정하는 태그. -->
<head> <!-- 문서 머릿말이 담기는 태그. -->
    <meta charset="UTF-8"> <!-- 태그의 속성들. 속성: 태그의 기능을 보충하는 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body> <!-- 웹 브라우저에 표시되는 영역. 문서의 본문. -->
    <p>test3333</p> <!-- 콘텐츠가 있는 태그는 항상 오픈 태그와 클로즈 태그는 항상 같아야 함. -->
    <!-- p태그 - 문단을 나타내는 태그. 단락과 단락을 구분하게 함. -->
    <br> <!-- 문단 안에서 줄바꿈을 할 때 사용하는 태그. 빈태그 -->
</body>
</html>
