<!DOCTYPE html>
<html lang="en">

<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="https://www.google.com" target="_blank">구글</a> 
    <!-- a태그 - 링크를 걸어주는 태그. href 속성 - 링크를 걸어주는 속성. target 속성 - 링크를 클릭했을 때 현재 보고 있는 탭이 아니라 새 탭에서 열리게 하는 속성. -->
    <!-- 웹 브라우저에서 나오는 링크를 클릭하기 전에는 파란색, 클릭한 이력이 생기면 보라색으로 링크의 색이 변함 
    a태그에서 href 속성이 a태그를 보조하는 것에서 확인할 수 있는 것처럼, 태그와 속성의 관계는 매우 중요함.-->
</body>
</html>
